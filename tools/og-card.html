<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #ede4d0; color: #21241f; overflow: hidden;
    font-family: "Cormorant Garamond", Georgia, "Noto Serif SC", "Songti SC", serif;
    position: relative;
    display: grid; grid-template-columns: 1fr 400px; align-items: center;
    padding: 0 70px; gap: 40px;
  }
  .grid { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 70px; pointer-events: none; }
  .grid i { width: 1px; background: rgba(33,36,31,.08); height: 100%; }
  .left { position: relative; }
  .eyebrow { font-family: Consolas, monospace; font-size: 11px; letter-spacing: .34em; color: #8a7d5e; margin-bottom: 22px; }
  .name { font-size: 132px; line-height: 1; letter-spacing: .06em; font-weight: 400; }
  .latin { font-family: Consolas, monospace; font-size: 12px; letter-spacing: .3em; color: #b08442; margin-top: 26px; }
  .tag { font-size: 30px; line-height: 1.55; margin-top: 30px; max-width: 560px; }
  .tag em { font-style: normal; color: #9c3f2a; }
  .foot { position: absolute; left: 70px; right: 70px; bottom: 34px; display: flex; justify-content: space-between;
    border-top: 1px solid rgba(33,36,31,.18); padding-top: 14px;
    font-family: Consolas, monospace; font-size: 10px; letter-spacing: .22em; color: #6d6a5c; }
  .seal { justify-self: center; text-align: center; }
  .seal img { width: 300px; display: block; }
  .seal .cap { font-family: Consolas, monospace; font-size: 9.5px; letter-spacing: .3em; color: #b08442; margin-top: 24px; }
</style>
</head>
<body>
<div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="left">
  <div class="eyebrow">PERSONAL ARCHIVE 路 FILE NO. 2027</div>
  <div class="name">Alpader</div>
  <div class="latin">STUDENT DEVELOPER 路 ARCHIVE 2027</div>
  <div class="tag">鎶婃椂闂存姌鎴愮焊椋炴満锛?br>鎶曞悜杩樻病鍒版潵鐨?<em>2027</em>銆?/div>
</div>
<div class="seal">
  <img src="../assets/logo/alpader-mark.svg" alt="">
  <div class="cap">PERSONAL ARCHIVE 路 EST. 2026</div>
</div>
<div class="foot"><span>ARCHIVE / 2027</span><span>GITHUB.COM/XINYUWANG668-ARCH</span><span>EST. 2026</span></div>
</body>
</html>
